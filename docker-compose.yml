services:
  supportlens-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supportlens-ai-streamlit
    ports:
      - "8501:8501"
    environment:
      APP_ENV: development
      LLM_PROVIDER: mock
      LLM_MODEL: mock-supportlens
      LLM_BASE_URL: ""
      LLM_API_KEY: ""
    restart: unless-stopped
