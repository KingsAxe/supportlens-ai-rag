[project]
name = "supportlens-ai-rag"
version = "0.1.0"
description = "Customer support intelligence RAG agent with local retrieval baselines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "sentence-transformers>=3,<4",
  "openai>=1.40,<2",
  "python-dotenv>=1.0,<2",
  "streamlit>=1.38,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
